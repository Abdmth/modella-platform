<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول - موديلة</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-dress"></i> موديلة</h1>
                <p>تسجيل الدخول</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">دخول</button>

                <div class="auth-divider">أو</div>

                <a href="register.html" class="btn btn-secondary btn-block">إنشاء حساب جديد</a>
            </form>

            <div class="auth-footer">
                <p>هل نسيت كلمة المرور؟ <a href="#">استعد هنا</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
