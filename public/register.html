<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل جديد - موديلة</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1><i class="fas fa-dress"></i> موديلة</h1>
                <p>إنشاء حساب جديد</p>
            </div>

            <form class="auth-form" id="registerForm">
                <div class="form-group">
                    <label>اسم المستخدم</label>
                    <input type="text" id="username" placeholder="اختر اسم مستخدم" required>
                </div>

                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="أدخل بريدك الإلكتروني" required>
                </div>

                <div class="form-group">
                    <label>رقم الهاتف</label>
                    <input type="tel" id="phone" placeholder="أدخل رقم هاتفك" required>
                </div>

                <div class="form-group">
                    <label>نوع الحساب</label>
                    <select id="role" required>
                        <option value="user">مستخدم عادي</option>
                        <option value="store">صاحب متجر</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>

                <div class="form-group">
                    <label>تأكيد كلمة المرور</label>
                    <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">إنشاء حساب</button>

                <div class="auth-divider">أو</div>

                <a href="login.html" class="btn btn-secondary btn-block">دخول إلى حسابك</a>
            </form>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
