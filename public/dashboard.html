<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - موديلة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/dashboard.css" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar">
                <div class="position-sticky">
                    <h5 class="text-white p-3"><i class="fas fa-star me-2"></i>موديلة</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link active" href="#dashboard"><i class="fas fa-chart-line me-2"></i>لوحة التحكم</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#profile"><i class="fas fa-user me-2"></i>الملف الشخصي</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#wallet"><i class="fas fa-wallet me-2"></i>المحفظة</a>
                        </li>
                        <li class="nav-item store-only" style="display:none;">
                            <a class="nav-link" href="#models"><i class="fas fa-person me-2"></i>الموديلات</a>
                        </li>
                        <li class="nav-item store-only" style="display:none;">
                            <a class="nav-link" href="#clothes"><i class="fas fa-shirt me-2"></i>الملابس</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#subscriptions"><i class="fas fa-crown me-2"></i>الاشتراكات</a>
                        </li>
                        <li class="nav-item admin-only" style="display:none;">
                            <a class="nav-link" href="#admin"><i class="fas fa-cogs me-2"></i>لوحة الإدارة</a>
                        </li>
                        <hr class="bg-secondary">
                        <li class="nav-item">
                            <a class="nav-link text-danger" href="#" onclick="logout()"><i class="fas fa-sign-out-alt me-2"></i>تسجيل الخروج</a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <!-- Header -->
                <div class="d-flex justify-content-between align-items-center py-3 border-bottom">
                    <h1 class="h2">لوحة التحكم</h1>
                    <div>
                        <span id="userName" class="me-3"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="logout()">خروج</button>
                    </div>
                </div>

                <!-- Dashboard Content -->
                <div id="content-area" class="mt-5">
                    <!-- Dashboard Overview -->
                    <div id="dashboard" class="section">
                        <h3>نظرة عامة</h3>
                        <div class="row g-4 mt-4">
                            <div class="col-md-6 col-lg-3">
                                <div class="card stat-card">
                                    <div class="card-body">
                                        <h6 class="card-title text-muted">الرصيد</h6>
                                        <h3 id="walletBalance">0 د.ع</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 col-lg-3">
                                <div class="card stat-card">
                                    <div class="card-body">
                                        <h6 class="card-title text-muted">الخطة</h6>
                                        <h3 id="subscriptionPlan">مجاني</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 col-lg-3 store-only" style="display:none;">
                                <div class="card stat-card">
                                    <div class="card-body">
                                        <h6 class="card-title text-muted">الموديلات</h6>
                                        <h3 id="modelsCount">0</h3>
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-6 col-lg-3 store-only" style="display:none;">
                                <div class="card stat-card">
                                    <div class="card-body">
                                        <h6 class="card-title text-muted">الملابس</h6>
                                        <h3 id="clothesCount">0</h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Section -->
                    <div id="profile" class="section" style="display:none;">
                        <h3>الملف الشخصي</h3>
                        <div class="card mt-4">
                            <div class="card-body">
                                <form id="profileForm">
                                    <div class="mb-3">
                                        <label class="form-label">اسم المستخدم</label>
                                        <input type="text" class="form-control" id="profileUsername" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">البريد الإلكتروني</label>
                                        <input type="email" class="form-control" id="profileEmail" disabled>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">رقم الهاتف</label>
                                        <input type="tel" class="form-control" id="profilePhone" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary">حفظ التغييرات</button>
                                </form>
                            </div>
                        </div>
                    </div>

                    <!-- Wallet Section -->
                    <div id="wallet" class="section" style="display:none;">
                        <h3>المحفظة</h3>
                        <div class="row mt-4">
                            <div class="col-lg-8">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">الرصيد الحالي</h5>
                                        <h2 class="text-primary mb-4" id="currentBalance">0 د.ع</h2>
                                        <h6>العمليات الأخيرة</h6>
                                        <div id="transactionsList" style="max-height: 400px; overflow-y: auto;">
                                            <!-- Transactions loaded here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
